name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options: [patch, minor, major]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    # Must match the Environment configured for npm Trusted Publisher.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # The version is stamped *before* building, so the SDK's static version, the
      # package and the tag agree (scripts/sync-version.mjs writes all three places).
      - name: Stamp the new version
        id: version
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          node scripts/sync-version.mjs "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: make build test

      - name: Commit and tag
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git commit -am "chore(release): ${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"

      - run: npm install -g npm@latest
      - run: npm pack --dry-run
      - run: npm publish --provenance --access public
      - run: git push origin HEAD --follow-tags

      # The launcher fetches <id>.tar.gz and reads <id>/<id>/ inside it.
      - name: Package the release archive
        run: |
          cp -r dist sonic3air
          tar -czf sonic3air.tar.gz sonic3air
          zip -qr sonic3air.zip sonic3air
          for f in sonic3air.sdk.js sonic3air.js sonic3air.wasm sonic3air.data sonic3air.data.json engine-specs.js app/app.js LICENSE; do
            tar -tzf sonic3air.tar.gz | grep -qx "sonic3air/sonic3air/$f"
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            sonic3air.tar.gz
            sonic3air.zip
